spring:
  application:
    name: tripstream
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/tripstream}
    username: ${DB_USER:tripstream}
    password: ${DB_PASSWORD:tripstream}
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
    # Only the api role migrates (see application-api.yml, ADR-005): concurrent first-boot
    # migrations from several roles race on Liquibase's lock-table creation.
    enabled: false
  cloud:
    aws:
      # Local default: LocalStack. In AWS, unset AWS_ENDPOINT and use the default credential chain.
      endpoint: ${AWS_ENDPOINT:http://localhost:4566}
      region:
        static: ${AWS_REGION:us-east-1}
      credentials:
        access-key: ${AWS_ACCESS_KEY_ID:test}
        secret-key: ${AWS_SECRET_ACCESS_KEY:test}
      s3:
        path-style-access-enabled: true
      sqs:
        # Never auto-create queues: an auto-created queue would silently lack the DLQ redrive policy.
        queue-not-found-strategy: FAIL

tripstream:
  splitter:
    chunk-rows: 5000          # rows per chunk file / chunk-jobs message
  worker:
    concurrency: 4            # chunks processed in parallel per worker process
    poll-size: 4              # SQS messages per poll; must be <= concurrency and <= 10
    db-batch-size: 500        # rows per JDBC batch
    lease: PT90S              # idempotency claim lease; must be shorter than the queue visibility timeout
  upload:
    url-expiry: PT15M
  buckets:
    raw: ${TRIPSTREAM_RAW_BUCKET:tripstream-raw}
    chunks: ${TRIPSTREAM_CHUNKS_BUCKET:tripstream-chunks}
    errors: ${TRIPSTREAM_ERRORS_BUCKET:tripstream-errors}
  queues:
    file-events: file-events
    chunk-jobs: chunk-jobs
    aggregator: aggregator-queue
    notifier: notifier-queue
  topics:
    trip-events: trip-events
  tables:
    idempotency: tripstream-idempotency
    job-progress: tripstream-job-progress

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
